<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <link rel="stylesheet" href="/public/css/gallery.css" />
  <link rel="stylesheet" href="/public/css/nav.css" />
  <link rel="stylesheet" href="/public/css/foot.css" />
  <link href="https://fonts.cdnfonts.com/css/pemberton-marsden-script" rel="stylesheet" />
</head>

<body>
  <svg width="0" height="0" style="position:absolute;">
    <defs>
      <clipPath id="heart" clipPathUnits="objectBoundingBox">
        <path d="M0.5,0.15 
          C0.5,0, 0,0, 0,0.375 
          C0,0.75, 0.5,1, 0.5,1 
          C0.5,1, 1,0.75, 1,0.375 
          C1,0, 0.5,0, 0.5,0.15 Z"/>
      </clipPath>
    </defs>
  </svg>
  <!-- Navigation -->
  <nav class="nav">
    <ul class="nav-links">
      <li><button><a href="index.html" class="links">HOME</a></button></li>
      <li><button><a href="gallery.html" class="links">GALLERY</a></button></li>
      <li><button><a href="#" class="links" onclick="alert('Coming soon!')">TIMELINE</a></button></li>
    </ul>
  </nav>

  <!-- Gallery -->
  <section class="gallery">
    <h2>GALLERY</h2>
    <div class="gallery-grid">
   <div class="gallery-item fade-in">
      <div class="heart-wrapper">
        <img src="/public/img/sample.png" alt="Photo 1">
      </div>
    </div>
       <div class="gallery-item fade-in">
      <div class="heart-wrapper">
        <img src="/public/img/sample.png" alt="Photo 1">
      </div>
    </div>
       <div class="gallery-item fade-in">
      <div class="heart-wrapper">
        <img src="/public/img/sample.png" alt="Photo 1">
      </div>
    </div>
       <div class="gallery-item fade-in">
      <div class="heart-wrapper">
        <img src="/public/img/sample.png" alt="Photo 1">
      </div>
    </div>
       <div class="gallery-item fade-in">
      <div class="heart-wrapper">
        <img src="/public/img/sample.png" alt="Photo 1">
      </div>
    </div>

  </section>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox hidden">
    <button class="nav-btn left-btn">&#10094;</button>
    <div class="lightbox-content">
      <div class="slide-wrapper" id="slide-wrapper">
        <img id="lightbox-img" alt="Zoomed photo" />
      </div>
      <div class="caption-container">
        <p id="lightbox-caption" class="caption"></p>
        <p id="lightbox-desc" class="desc"></p>
      </div>
    </div>
    <button class="nav-btn right-btn">&#10095;</button>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="foot-cont">
      <div class="left-foot fade-in">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit...
      </div>
      <div class="rigth-foot fade-in">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit...
      </div>
    </div>
  </footer>

  <!-- Script -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const fadeElements = document.querySelectorAll('.fade-in');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.2 });
      fadeElements.forEach(el => observer.observe(el));
    });

    const galleryItems = document.querySelectorAll(".gallery-item img");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const lightboxCaption = document.getElementById("lightbox-caption");
    const lightboxDesc = document.getElementById("lightbox-desc");
    const leftBtn = document.querySelector(".left-btn");
    const rightBtn = document.querySelector(".right-btn");

    let currentIndex = 0;

    function showLightbox(index) {
      currentIndex = index;
      const img = galleryItems[index];
      lightboxImg.src = img.src;
      lightboxCaption.textContent = img.dataset.caption || "💖 Our memory 💖";
      lightboxDesc.textContent = img.dataset.desc || "";
      lightbox.classList.remove("hidden");
    }

    function hideLightbox() {
      lightbox.classList.add("hidden");
      lightboxImg.src = "";
      lightboxCaption.textContent = "";
      lightboxDesc.textContent = "";
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % galleryItems.length;
      showLightbox(currentIndex);
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + galleryItems.length) % galleryItems.length;
      showLightbox(currentIndex);
    }

    galleryItems.forEach((img, index) => {
      img.addEventListener("click", () => {
        showLightbox(index);
      });
    });

    lightbox.addEventListener("click", (e) => {
      if (e.target === lightbox || e.target === lightboxImg) {
        hideLightbox();
      }
    });

    rightBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      animateSwipe("left");
    });

    leftBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      animateSwipe("right");
    });


   document.addEventListener("keydown", (e) => {
      if (lightbox.classList.contains("hidden")) return;
      if (e.key === "ArrowRight") animateSwipe("left");
      if (e.key === "ArrowLeft") animateSwipe("right");
      if (e.key === "Escape") hideLightbox();
    });


    // Swipe with animation
    let touchStartX = 0;
    let touchEndX = 0;

    lightbox.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, false);

    lightbox.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleGesture();
    }, false);

    function handleGesture() {
      const threshold = 50;
      const swipeDistance = touchStartX - touchEndX;
      if (Math.abs(swipeDistance) > threshold) {
        swipeDistance > 0 ? animateSwipe("left") : animateSwipe("right");
      }
    }

    function animateSwipe(direction) {
      const wrapper = document.getElementById("slide-wrapper");

      if (wrapper.classList.contains("animating")) return;
      wrapper.classList.add("animating");

      const outDir = direction === "left" ? "-100%" : "100%";
      const inDir = direction === "left" ? "100%" : "-100%";

      // Animate out
      wrapper.style.transition = "transform 0.3s ease";
      wrapper.style.transform = `translateX(${outDir})`;

      setTimeout(() => {
        // Immediately jump to opposite side (off-screen)
        wrapper.style.transition = "none";

        currentIndex = direction === "left"
          ? (currentIndex + 1) % galleryItems.length
          : (currentIndex - 1 + galleryItems.length) % galleryItems.length;

        const img = galleryItems[currentIndex];
        lightboxImg.src = img.src;
        typeText(lightboxCaption, img.dataset.caption || "💖 Our memory 💖", 25);
        lightboxDesc.textContent = img.dataset.desc || "";

        // Move wrapper off-screen from other side
        wrapper.style.transform = `translateX(${inDir})`;

        // Animate back to center
        requestAnimationFrame(() => {
          wrapper.style.transition = "transform 0.3s ease";
          wrapper.style.transform = "translateX(0)";
        });

        // Allow future swipes after animation completes
        setTimeout(() => {
          wrapper.classList.remove("animating");
        }, 300);
      }, 300);
    }

    function typeText(element, text, speed = 150) {
      element.textContent = "";
      let index = 0;

      function type() {
        if (index < text.length) {
          element.textContent += text.charAt(index);
          index++;
          setTimeout(type, speed);
        }
      }

      type();
    }



  </script>
</body>
</html>
